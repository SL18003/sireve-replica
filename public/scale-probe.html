<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>scale</title></head>
<body>
<iframe id="f" style="width:1280px;height:1000px;border:0"></iframe>
<pre id="report">pending</pre>
<script>
const route = new URLSearchParams(location.search).get('route') || '/';
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  const w = f.contentWindow, d = f.contentDocument;
  await w.document.fonts.ready;
  await new Promise((r) => setTimeout(r, 1200));
  const cs = w.getComputedStyle;
  const lines = [];
  /* 1) base real dentro de la app (lo que hay que replicar en .sireve) */
  const app = d.querySelector('.g-root, .sireve') || d.body;
  const ac = cs(app);
  lines.push(`ROOT -> font ${ac.fontSize}/${ac.lineHeight} letter-spacing ${ac.letterSpacing} weight ${ac.fontWeight} family ${ac.fontFamily.slice(0, 12)}`);
  lines.push(`BODY -> font ${cs(d.body).fontSize}/${cs(d.body).lineHeight} ls ${cs(d.body).letterSpacing}`);
  const brand = d.querySelector('.site-header');
  if (brand) lines.push(`.site-header -> font ${cs(brand).fontSize}/${cs(brand).lineHeight} ls ${cs(brand).letterSpacing}`);

  /* 2) escala tipografica de Gravity (clases g-text_*) */
  const seen = new Set();
  for (const el of d.querySelectorAll('[class*="g-text"]')) {
    const g = [...el.classList].find((c) => c.startsWith('g-text')) || 'g-text';
    if (seen.has(g)) continue;
    seen.add(g);
    const c = cs(el);
    lines.push(`${g} -> ${c.fontSize}/${c.lineHeight} w${c.fontWeight} ls${c.letterSpacing} color ${c.color}`);
  }

  /* 3) clases propias del proyecto que heredan de Gravity */
  const own = ['.page-hero-title', '.page-hero-sub', '.section-title', '.section-desc',
    '.footer-col-title', '.footer-copy', '.footer-text', '.btn-ver', '.sireve-eyebrow',
    '.landing-hero-stat-label', '.program-card-label', '.quick-card-title', '.quick-card-desc',
    '.landing-btn', '.program-card-cta', '.actas-card-title', '.actas-card-desc',
    '.galeria-year-title', '.gallery-album-title', '.gallery-album-meta', '.program-heading',
    '.program-about-text', '.timeline-title', '.timeline-lead', '.reglamentos-item-title',
    '.contacto-label', '.contacto-info-heading', '.contacto-info-link', '.social-links-item',
    '.carousel-btn', '.carousel-dot', '.header-mobile-toggle', '.header-link', '.landing-hero-h1',
    '.sireve-title', '.landing-hero-sub', '.program-other-title', '.program-other-sub',
    '.program-back', '.program-meta-label', '.program-meta-value', '.footer-csuca'];
  for (const sel of own) {
    const el = d.querySelector(sel);
    if (!el) { lines.push(`${sel} -> NO EXISTE`); continue; }
    const c = cs(el);
    /* Campos separados por `;` porque scale-diff.mjs corta cada valor en el
       primer `;`. Si se dejan pegados ("display flex pad 11px ff Arial"), el
       campo `display` se traga el resto de la linea y las diferencias reales
       del user-agent de <button> aparecen como si fueran de display. */
    lines.push(`${sel} (${el.tagName.toLowerCase()}.${[...el.classList].filter((x) => !x.startsWith('g-')).join('.')}) -> font ${c.fontSize}/${c.lineHeight}; w ${c.fontWeight}; ls ${c.letterSpacing}; display ${c.display}; pad ${c.padding}; ff ${c.fontFamily.split(',')[0]}`);
  }
  document.getElementById('report').textContent = lines.join('\n');
});
f.src = route;
</script>
</body></html>
